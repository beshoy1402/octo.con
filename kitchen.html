<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display — Flavor House</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --dark:#0a0a0a;--dark2:#111;--dark3:#1a1a1a;--dark4:#222;
  --text:#f0f0f0;--text2:#aaa;--text3:#555;--accent:#7C3AED;
  --border:rgba(255,255,255,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
#kds-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--dark2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:16px;flex-wrap:wrap}
.kds-logo{font-size:18px;font-weight:800}
.kds-logo span{color:var(--accent)}
.kds-stats{display:flex;gap:24px;align-items:center}
.kds-stat{text-align:center}
.kds-stat-num{font-size:22px;font-weight:800}
.kds-stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.kds-time{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:50%}
.sound-btn{padding:7px 16px;border-radius:50px;border:1px solid var(--border);background:var(--dark3);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s}
.sound-btn.on{border-color:var(--green);color:var(--green)}
#kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.kds-card{border-radius:16px;border:2px solid transparent;background:var(--dark2);overflow:hidden;animation:cardIn .35s cubic-bezier(0.4,0,0.2,1);transition:border-color .3s;display:flex;flex-direction:column}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.kds-card.age-fresh{border-color:rgba(34,197,94,.4)}
.kds-card.age-warn{border-color:rgba(245,158,11,.5)}
.kds-card.age-urgent{border-color:rgba(239,68,68,.6);animation:urgentPulse 1.5s ease-in-out infinite}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.kds-timer-bar{height:4px;background:var(--dark3);overflow:hidden}
.kds-timer-fill{height:100%;transition:width .5s linear}
.age-fresh .kds-timer-fill{background:var(--green)}
.age-warn .kds-timer-fill{background:var(--yellow)}
.age-urgent .kds-timer-fill{background:var(--red)}
.kds-card-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kds-order-num{font-size:22px;font-weight:800;color:var(--accent)}
.kds-table{font-size:13px;color:var(--text2);margin-top:2px}
.kds-age{font-size:13px;font-weight:700;padding:4px 10px;border-radius:50px}
.age-fresh .kds-age{background:rgba(34,197,94,.15);color:var(--green)}
.age-warn .kds-age{background:rgba(245,158,11,.15);color:var(--yellow)}
.age-urgent .kds-age{background:rgba(239,68,68,.15);color:var(--red)}
.kds-items{padding:12px 16px;flex:1}
.kds-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.kds-item:last-child{border-bottom:none}
.kds-item-en{font-weight:700;font-size:15px}
.kds-item-ar{font-size:12px;color:var(--text2);direction:rtl;text-align:right;margin-top:2px}
.kds-item-qty{font-size:18px;font-weight:800;width:38px;height:38px;border-radius:50%;background:var(--dark3);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.kds-notes{padding:0 16px 12px;font-size:13px;color:var(--yellow);font-style:italic}
.kds-status{font-size:11px;padding:3px 9px;border-radius:50px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.s-pending{background:rgba(59,130,246,.15);color:var(--blue)}
.s-confirmed{background:rgba(245,158,11,.12);color:var(--yellow)}
.s-preparing{background:rgba(245,158,11,.15);color:var(--yellow)}
.s-ready{background:rgba(34,197,94,.12);color:var(--green)}
.kds-actions{display:flex;border-top:1px solid var(--border)}
.kds-btn{flex:1;padding:14px 8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.kds-btn:hover{background:var(--dark3);color:var(--text)}
.kds-btn:not(:last-child){border-right:1px solid var(--border)}
.kds-btn.confirm{color:var(--blue)}
.kds-btn.confirm:hover{background:rgba(59,130,246,.1)}
.kds-btn.prepare{color:var(--yellow)}
.kds-btn.prepare:hover{background:rgba(245,158,11,.1)}
.kds-btn.ready{color:var(--green);font-size:14px}
.kds-btn.ready:hover{background:rgba(34,197,94,.1)}
.kds-btn.cancel{color:var(--red)}
.kds-btn.cancel:hover{background:rgba(239,68,68,.1)}
#empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;text-align:center;color:var(--text3)}
#empty-state .icon{font-size:72px;margin-bottom:20px}
#flash{position:fixed;inset:0;background:rgba(34,197,94,.08);pointer-events:none;z-index:999;opacity:0;transition:opacity .3s}
#flash.show{opacity:1}
#done-section{padding:0 20px 20px}
#done-section h3{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:12px 0 10px;border-top:1px solid var(--border)}
#done-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.done-card{padding:10px 14px;border-radius:12px;background:var(--dark3);border:1px solid var(--border);opacity:.5;display:flex;align-items:center;justify-content:space-between}
.done-card-num{font-size:13px;font-weight:700;color:var(--text2)}
.done-card-time{font-size:11px;color:var(--text3)}
</style>
</head>
<body>
<div id="flash"></div>
<header id="kds-header">
  <div class="kds-logo">Flavor<span>House</span> <span style="font-size:13px;color:var(--text3);font-weight:400">Kitchen</span></div>
  <div class="kds-stats">
    <div class="kds-stat"><div class="kds-stat-num" id="statActive" style="color:var(--yellow)">0</div><div class="kds-stat-label">Active</div></div>
    <div class="kds-stat"><div class="kds-stat-num" id="statDone" style="color:var(--green)">0</div><div class="kds-stat-label">Done today</div></div>
    <div class="kds-stat"><div class="kds-stat-num" id="statUrgent" style="color:var(--red)">0</div><div class="kds-stat-label">Urgent</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>&lt;5 min</div>
      <div class="leg"><div class="leg-dot" style="background:var(--yellow)"></div>5–12 min</div>
      <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>&gt;12 min</div>
    </div>
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">🔔 Sound ON</button>
    <div class="kds-time" id="clock">--:--:--</div>
  </div>
</header>
<div id="kds-grid"></div>
<div id="empty-state"><div class="icon">✅</div><p>All clear — no active orders</p></div>
<div id="done-section" style="display:none"><h3>Completed today</h3><div id="done-grid"></div></div>

<script>
'use strict';

/* ── Self-contained Firebase init — no db.js dependency ── */
const KITCHEN_FIREBASE_CONFIG = {
  apiKey:            "AIzaSyD0fFEilVq5sJud3E2nzTEZ9wezpim3o7k",
  authDomain:        "system-fb58f.firebaseapp.com",
  projectId:         "system-fb58f",
  storageBucket:     "system-fb58f.firebasestorage.app",
  messagingSenderId: "206434677599",
  appId:             "1:206434677599:web:6ab4658982fa9942dcbcea"
};

/* Init only if not already initialized */
let kitchenApp;
try {
  kitchenApp = firebase.app('kitchen');
} catch(e) {
  try {
    kitchenApp = firebase.initializeApp(KITCHEN_FIREBASE_CONFIG, 'kitchen');
  } catch(e2) {
    /* If default app already has same config, use it */
    try { kitchenApp = firebase.app(); } catch(e3) {
      kitchenApp = firebase.initializeApp(KITCHEN_FIREBASE_CONFIG);
    }
  }
}
const kdb = kitchenApp.firestore();
const kauth = kitchenApp.auth();
// Sign in anonymously so Firestore rules allow reads
kauth.signInAnonymously().catch(e => console.warn('[Kitchen] Anonymous auth failed:', e.message));

const KDS = { orders:{}, soundOn:true, audioCtx:null };

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

function toggleSound() {
  KDS.soundOn = !KDS.soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = KDS.soundOn ? '🔔 Sound ON' : '🔕 Sound OFF';
  btn.className = 'sound-btn'+(KDS.soundOn?' on':'');
}

function playChime(type) {
  if (!KDS.soundOn) return;
  try {
    if (!KDS.audioCtx) KDS.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = KDS.audioCtx;
    (type==='new'?[523,659,784]:[784,659]).forEach((freq,i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(0,ctx.currentTime+i*.18);
      gain.gain.linearRampToValueAtTime(.22,ctx.currentTime+i*.18+.05);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.4);
      osc.start(ctx.currentTime+i*.18);osc.stop(ctx.currentTime+i*.18+.5);
    });
  } catch {}
}

function flashScreen() {
  const el=document.getElementById('flash');
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),600);
}

function getAge(ts) {
  if (!ts) return 0;
  const d=ts.toDate?ts.toDate():new Date(ts);
  return Math.floor((Date.now()-d.getTime())/60000);
}
function ageClass(m){return m<5?'age-fresh':m<12?'age-warn':'age-urgent';}

function renderGrid() {
  const grid=document.getElementById('kds-grid');
  const empty=document.getElementById('empty-state');
  const active=Object.values(KDS.orders)
    .filter(o=>['pending','confirmed','preparing','ready'].includes(o.status))
    .sort((a,b)=>{
      const ta=a.created_at?.toDate?a.created_at.toDate():new Date(a.created_at||0);
      const tb=b.created_at?.toDate?b.created_at.toDate():new Date(b.created_at||0);
      return ta-tb;
    });
  document.getElementById('statActive').textContent=active.length;
  document.getElementById('statUrgent').textContent=active.filter(o=>getAge(o.created_at)>=12).length;
  if(!active.length){grid.innerHTML='';empty.style.display='flex';}
  else{empty.style.display='none';grid.innerHTML=active.map(buildCard).join('');}
  renderDone();
}

function buildCard(o) {
  const age=getAge(o.created_at);
  const ac=ageClass(age);
  const ageLabel=age<1?'Just now':`${age} min`;
  const timerW=Math.min(100,Math.round(age/15*100));
  const next={
    pending:   `<button class="kds-btn confirm"  onclick="advance('${o.id}','confirmed')">✓ Confirm</button>`,
    confirmed: `<button class="kds-btn prepare"  onclick="advance('${o.id}','preparing')">👨‍🍳 Start Cooking</button>`,
    preparing: `<button class="kds-btn ready"    onclick="advance('${o.id}','ready')">🔔 Ready!</button>`,
    ready:     `<button class="kds-btn ready"    onclick="advance('${o.id}','done')">✅ Served</button>`,
  };
  return `
  <div class="kds-card ${ac}" id="kds-card-${o.id}">
    <div class="kds-timer-bar"><div class="kds-timer-fill" style="width:${timerW}%"></div></div>
    <div class="kds-card-header">
      <div>
        <div class="kds-order-num">#${o.order_number}</div>
        <div class="kds-table">Table ${o.table_number}${o.customer_name?` · ${o.customer_name}`:''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <span class="kds-status s-${o.status}">${o.status}</span>
        <span class="kds-age">${ageLabel}</span>
      </div>
    </div>
    <div class="kds-items">
      ${(o.items||[]).map(i=>`
        <div class="kds-item">
          <div style="flex:1;min-width:0">
            <div class="kds-item-en">${i.name}</div>
            ${i.name_ar?`<div class="kds-item-ar">${i.name_ar}</div>`:''}
          </div>
          <span class="kds-item-qty">${i.qty}</span>
        </div>`).join('')}
    </div>
    ${o.notes?`<div class="kds-notes">📝 ${o.notes}</div>`:''}
    <div class="kds-actions">
      ${next[o.status]||''}
      <button class="kds-btn cancel" onclick="advance('${o.id}','cancelled')" title="Cancel">✕</button>
    </div>
  </div>`;
}

function renderDone() {
  const sec=document.getElementById('done-section');
  const grid=document.getElementById('done-grid');
  const today=new Date().toDateString();
  const done=Object.values(KDS.orders).filter(o=>{
    if(o.status!=='done')return false;
    const ts=o.created_at?.toDate?o.created_at.toDate():new Date(o.created_at||0);
    return ts.toDateString()===today;
  }).sort((a,b)=>{
    const ta=a.created_at?.toDate?a.created_at.toDate():new Date(a.created_at||0);
    const tb=b.created_at?.toDate?b.created_at.toDate():new Date(b.created_at||0);
    return tb-ta;
  });
  document.getElementById('statDone').textContent=done.length;
  if(!done.length){sec.style.display='none';return;}
  sec.style.display='block';
  grid.innerHTML=done.slice(0,12).map(o=>{
    const ts=o.created_at?.toDate?o.created_at.toDate():new Date(o.created_at||0);
    return `<div class="done-card">
      <div><div class="done-card-num">#${o.order_number} · T${o.table_number}</div>
      <div class="done-card-time">${(o.items||[]).map(i=>i.name).join(', ').slice(0,28)}</div></div>
      <div class="done-card-time">${ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}

setInterval(()=>{
  Object.values(KDS.orders).forEach(o=>{
    const card=document.getElementById(`kds-card-${o.id}`);
    if(!card)return;
    const age=getAge(o.created_at);
    card.className=`kds-card ${ageClass(age)}`;
    const bar=card.querySelector('.kds-timer-fill');
    if(bar)bar.style.width=Math.min(100,Math.round(age/15*100))+'%';
    const ageEl=card.querySelector('.kds-age');
    if(ageEl)ageEl.textContent=age<1?'Just now':`${age} min`;
  });
},30000);

async function advance(id,status) {
  try{
    await kdb.collection('orders').doc(id).update({
      status,
      updated_at: firebase.firestore.FieldValue.serverTimestamp(),
      ...(status==='preparing' ? {prep_started_at: firebase.firestore.FieldValue.serverTimestamp()} : {}),
      ...(status==='done'      ? {completed_at:    firebase.firestore.FieldValue.serverTimestamp()} : {}),
    });
    if(KDS.orders[id])KDS.orders[id].status=status;
    if(status==='done'||status==='cancelled')playChime('done');
    renderGrid();
  }catch(e){alert('Failed: '+e.message);}
}

/* Simple orderBy created_at only — no compound index needed */
function initRealtime() {
  kdb.collection('orders')
    .orderBy('created_at','desc')
    .limit(150)
    .onSnapshot(snap=>{
      let hasNew=false;
      snap.docChanges().forEach(change=>{
        const o={id:change.doc.id,...change.doc.data()};
        if(!['pending','confirmed','preparing','ready','done','cancelled'].includes(o.status))return;
        if(change.type==='added'&&!KDS.orders[o.id]&&
           ['pending','confirmed','preparing','ready'].includes(o.status))hasNew=true;
        KDS.orders[o.id]=o;
      });
      /* Prune old done/cancelled */
      const cutoff=Date.now()-4*60*60*1000;
      Object.keys(KDS.orders).forEach(id=>{
        const o=KDS.orders[id];
        if(['done','cancelled'].includes(o.status)){
          const ts=o.created_at?.toDate?o.created_at.toDate():new Date(o.created_at||0);
          if(ts.getTime()<cutoff)delete KDS.orders[id];
        }
      });
      if(hasNew){
        playChime('new');flashScreen();
        let fl=true;const orig='Kitchen Display — Flavor House';
        const iv=setInterval(()=>{document.title=fl?'🔔 NEW ORDER!':orig;fl=!fl;},600);
        setTimeout(()=>{clearInterval(iv);document.title=orig;},5000);
      }
      renderGrid();
    });
}

document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('click',()=>{
    if(!KDS.audioCtx)KDS.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  },{once:true});
  kauth.signInAnonymously()
    .then(initRealtime)
    .catch(initRealtime); // start anyway even if auth fails
});
</script>
</body>
</html>
